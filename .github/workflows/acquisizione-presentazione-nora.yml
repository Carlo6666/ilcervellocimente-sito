name: Acquisizione presentazione Nora
on:
  push:
    branches: [sito-v3-1]
    paths: ['.github/workflows/acquisizione-presentazione-nora.yml']
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sito-v3-1
      - name: Installa FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Scarica il filmato esistente e verifica
        env:
          VIDEO_URL: "https://files2.heygen.ai/aws_pacific/avatar_tmp/21e45a12a8104b6aa5ca8ee5b168d5cb/bcffdc21b35239be6bc497c5774ea018.mp4?Expires=1796101445&Signature=paPeMZWXdGx7cJJWcYapb0RJlHj1LkCAgc06s1tphW1ee~TLpMUOgdImxHqEjbyyIkFgncNb3AZCNWrvaRMDhpoFACUdCePncStfJarkYUgi7I1lEbIRz49H~51bWPoQQbAZg7G7H7biFjZut76wAbvjhVLoLhXNFiKTMEEWBF8pGEhItqmtaOit-NgYRIH4L7xwp~p4EytKNSJT7~RUdtvqHFLSsh3ifDBEG151kE-ohb4C7HeFfRR6FhoD2qgjJc4sNDZYP0CpbhpYi-w8dWhLkwTmtXxesFxLUWFY4el5EqkPWzhBjX1KE-waQ0V4GM04khVci9KEmsGvsUqvGA__&Key-Pair-Id=K3TSZ3KU01LY58"
        run: |
          mkdir -p assets/video
          curl --fail --location --retry 2 --silent --show-error "$VIDEO_URL" -o /tmp/nora-intro.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/nora-intro.mp4
          ffmpeg -v error -y -i /tmp/nora-intro.mp4 -vf "scale='min(720,iw)':-2" -c:v libx264 -preset fast -crf 25 -maxrate 1500k -bufsize 3000k -c:a aac -b:a 96k -movflags +faststart assets/video/nora-presentazione-it.mp4
          python3 - <<'PY'
          import os,subprocess,json
          p='assets/video/nora-presentazione-it.mp4'
          j=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
          assert 90 < float(j['format']['duration']) < 96
          assert {s['codec_type'] for s in j['streams']} >= {'audio','video'}
          assert os.path.getsize(p)<25*1024*1024
          print('Video verificato:',j['format']['duration'],os.path.getsize(p))
          PY
      - name: Salva copia stabile sul ramo di lavoro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/nora-presentazione-it.mp4
          git commit -m "Acquisisci presentazione Nora IT esistente (zero crediti)" || exit 0
          git pull --rebase origin sito-v3-1
          git push origin HEAD:sito-v3-1
