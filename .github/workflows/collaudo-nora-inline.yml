name: Collaudo mirato Nora inline
on:
  push:
    branches: [sito-v3-1]
    paths: ['.github/workflows/collaudo-nora-inline.yml', 'index.html', 'css/sito-v3-1.css']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verifica browser mirata
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nora-server.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          fs.mkdirSync('nora-collaudo',{recursive:true});
          const results=[];
          const expected={it:'IL PROGETTO',en:'THE PROJECT',fr:'LE PROJET',es:'EL PROYECTO',de:'DAS PROJEKT'};
          for(const width of [360,412,1440]){
            for(const lang of Object.keys(expected)){
              const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
              await page.route('**/*',route=>route.request().url().startsWith('http://127.0.0.1:8765/')?route.continue():route.abort());
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              try{
                await page.goto('http://127.0.0.1:8765/?lang='+lang,{waitUntil:'domcontentloaded'});
                assert.equal(await page.locator('[data-project-text="0"]').textContent(),expected[lang]);
                assert.equal(await page.locator('#video-modal').count(),0);
                const frame=page.locator('.hero-image-frame');
                assert.equal(await frame.evaluate(e=>getComputedStyle(e).borderTopWidth),'0px');
                assert.equal(await frame.evaluate(e=>getComputedStyle(e).borderTopLeftRadius),'0px');
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth),width);
                await page.locator('.hero-video-play').evaluate(e=>e.click());
                const inline=page.locator('.hero-video-wrap > #video-inline');
                assert.equal(await inline.count(),1);
                assert.equal(await inline.isVisible(),true);
                assert.equal(await page.locator('body').evaluate(e=>e.classList.contains('modal-open')),false);
                const src=await inline.locator('video,iframe').getAttribute('src');
                assert.ok(src.includes('nora-presentazione-it.mp4') || src.includes('bcffdc21b35239be6bc497c5774ea018.mp4'));
                await inline.locator('#inline-stop').evaluate(e=>e.click());
                assert.equal(await inline.isVisible(),false);
                await page.locator('.featured-media .big-play').evaluate(e=>e.click());
                assert.equal(await page.locator('.featured-media > #video-inline').isVisible(),true);
                const episodeSrc=await page.locator('.featured-media > #video-inline').locator('video,iframe').getAttribute('src');
                assert.ok(lang==='it'?episodeSrc.includes('youtube-nocookie.com'):episodeSrc.includes('puntata-0-'+lang+'.mp4'));
                assert.notEqual(src,episodeSrc);
                await page.locator('#inline-stop').evaluate(e=>e.click());
                assert.deepEqual(errors,[]);
                await page.locator('.hero-visual').screenshot({path:'nora-collaudo/'+width+'-'+lang+'.png'});
                results.push({width,lang,pass:true});
              }catch(e){results.push({width,lang,pass:false,error:String(e)});}
              finally{await page.close();}
            }
          }
          await browser.close();
          fs.writeFileSync('nora-collaudo/results.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          if(results.some(r=>!r.pass))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nora-collaudo-inline
          path: nora-collaudo/
