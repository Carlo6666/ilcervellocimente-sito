# Montaggio dei doppiaggi della Puntata 0 per il sito (zero crediti HeyGen, nessuna generazione).
# Gira solo sul ramo di lavoro sito-v3-1 e solo quando cambia questo file o lo script.
# Non pubblica nulla: GitHub Pages usa il ramo gh-pages, che questo flusso non tocca.
name: Doppiaggi Puntata 0 (montaggio e verifica)
on:
  push:
    branches: [sito-v3-1]
    paths:
      - .github/workflows/doppiaggi-puntata-0.yml
      - tools/video/monta-doppiaggi.sh
permissions:
  contents: write
concurrency:
  group: doppiaggi-puntata-0
  cancel-in-progress: false
jobs:
  monta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sito-v3-1
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Scarica, monta e verifica
        run: bash tools/video/monta-doppiaggi.sh
      - name: Salva sul ramo sito-v3-1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video docs/verifica-video
          git commit -m "Puntata 0 doppiata: montaggio e verifica automatica (run ${GITHUB_RUN_ID}, zero crediti)" || exit 0
          git pull --rebase origin sito-v3-1
          git push origin HEAD:sito-v3-1
