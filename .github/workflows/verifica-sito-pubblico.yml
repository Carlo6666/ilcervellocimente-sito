name: Verifica sito pubblico (sola lettura)
on:
  workflow_dispatch:
  push:
    branches: [sito-v3-1]
    paths: ['.github/workflows/verifica-sito-pubblico.yml', '.github/collaudo/live.mjs']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pubblicato
      - uses: actions/checkout@v4
        with:
          ref: sito-v3-1
          path: lavoro
          sparse-checkout: .github/collaudo
      - name: File pubblici identici a gh-pages
        run: |
          set -e
          B=https://www.ilcervellocimente.com
          curl -sS -o /dev/null -w "home: %{http_code}\n" "$B/"
          curl -sS "$B/?nocache=$(date +%s)" -o /tmp/index.html
          cmp /tmp/index.html pubblicato/index.html && echo "index.html online = gh-pages"
          grep -c 'class="big-play hero-big-play"' /tmp/index.html
          for l in it en fr es de; do
            for f in nora-presentazione-$l.mp4 $( [ $l != it ] && echo puntata-0-$l.mp4 ); do
              curl -sS "$B/assets/video/$f" -o /tmp/$f
              a=$(sha256sum /tmp/$f | cut -c1-16); b=$(sha256sum pubblicato/assets/video/$f | cut -c1-16)
              r=$(curl -sS -o /dev/null -w "%{http_code}" -H "Range: bytes=0-99" "$B/assets/video/$f")
              echo "$f online=$a repo=$b range=$r"; [ "$a" = "$b" ] && [ "$r" = "206" ]
            done
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium webkit
      - name: Riproduzione sul sito pubblico (Chrome Android e iPhone/WebKit)
        run: node lavoro/.github/collaudo/live.mjs
